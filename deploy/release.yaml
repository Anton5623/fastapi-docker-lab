app: hpk-fastapi
environment: production

image:
  registry: ghcr.io
  repository: anton5623/fastapi-docker-lab/fastapi-ci
  tag: sha-0031fa0eaa0799e8d323d6c6c1ba469c02cd2141

container:
  port: 8000

health:
  path: /health

strategy:
  type: canary
  stages: [0, 10, 50, 100]

platforms:
  azure_container_apps:
    region: swedencentral
    resources:
      cpu: 0.5
      memory: 1Gi
    scaling:
      min_replicas: 0
      max_replicas: 2
