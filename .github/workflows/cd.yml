name: FastAPI CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Тег із GHCR (sha-...)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        env:
          IMAGE: ghcr.io/anton5623/fastapi-docker-lab/fastapi-ci:${{ inputs.image_tag }}
          RESOURCE_GROUP: rg-fastapi-lab
          APP: fastapi-lab-student7
        run: |
          az extension add --name containerapp --upgrade
          az containerapp update \
            --name "$APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify health endpoint
        run: |
          URL="https://fastapi-lab-student7.delightfulstone-b50cabfa.swedencentral.azurecontainerapps.io"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 \
            "$URL/health"
